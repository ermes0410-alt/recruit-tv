<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인재채용부 채용일정</title>
<style>
html,body{margin:0;height:100%;background:#0B1118;overflow:hidden}
iframe{position:fixed;left:0;top:0;width:100%;height:100%;border:0;pointer-events:none}
#hint{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);-webkit-transform:translateX(-50%);
  background:rgba(20,29,39,.94);color:#E8EEF4;border:2px solid #5B8CFF;border-radius:14px;
  padding:18px 30px;font:600 26px/1.4 Pretendard,"Malgun Gothic",sans-serif;text-align:center;z-index:9;white-space:nowrap}
#hint small{display:block;font-size:19px;font-weight:400;color:#93A3B4}
.full{cursor:none}
.full #hint{display:none}
</style>
</head>
<body>
<!-- 바깥 화면은 전체화면만 담당하고, 일정 화면(board.html)은 안쪽에서 30분마다 새로고침됩니다.
     안쪽만 새로고침되므로 전체화면이 풀리지 않습니다. -->
<iframe id="board" tabindex="-1" title="채용일정"></iframe>
<script>document.getElementById('board').src='board.html?v='+Date.now();</script>
<div id="hint">리모컨 <b>확인(OK)</b> 버튼을 누르면 전체화면으로 바뀝니다<small>안 되면 TV 브라우저 메뉴의 '전체화면'을 이용하세요</small></div>
<script>
var root = document.documentElement;
function isFull(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function goFull(){
  if (isFull()) return;
  var f = root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen;
  if (f) { try { var p = f.call(root); if (p && p.catch) p.catch(function(){}); } catch(e){} }
}
function sync(){ document.body.className = isFull() ? 'full' : ''; }
document.addEventListener('fullscreenchange', sync);
document.addEventListener('webkitfullscreenchange', sync);
document.addEventListener('keydown', function(e){
  var k = e.key || '', c = e.keyCode;
  if (k === 'Enter' || k === ' ' || c === 13 || c === 32 || c === 415) goFull();
});
document.addEventListener('click', goFull);
// 안쪽 화면이 다시 읽힌 뒤에도 리모컨 입력이 바깥 화면으로 오도록 포커스를 되돌립니다.
document.getElementById('board').addEventListener('load', function(){ try { window.focus(); } catch(e){} });
// 전체화면을 지원하지 않는 브라우저면 안내만 바꿉니다.
if (!(root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen))
  document.getElementById('hint').innerHTML = 'TV 브라우저 메뉴에서 <b>전체화면</b>을 켜 주세요';
// 안내 문구는 1분 뒤 자동으로 숨깁니다(전체화면 전환은 계속 가능).
setTimeout(function(){ document.getElementById('hint').style.display='none'; }, 60000);
</script>
</body>
</html>
